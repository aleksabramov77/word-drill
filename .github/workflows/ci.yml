name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    # Не ubuntu-latest: с 19.10.2026 это Ubuntu 26, и `playwright install --with-deps` там зависал до тайм-аута.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # У каждой выкатки свой номер: версия в package.json выше, чем в ветке, куда вливается PR.
      - name: Версия поднята?
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_REF"
          pnpm exec tsx scripts/check-version.ts "origin/$BASE_REF"
        env:
          BASE_REF: ${{ github.base_ref }}
      - run: pnpm check
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
        timeout-minutes: 5
      - run: pnpm test:e2e
      # Скриншоты и трассировки упавших e2e: gh run download <id>, затем playwright show-trace.
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: test-results/
          retention-days: 7
